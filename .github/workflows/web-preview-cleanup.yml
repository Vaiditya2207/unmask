name: Web preview cleanup

on:
  pull_request_target:
    branches: [main]
    types: [closed]

permissions:
  contents: read

concurrency:
  group: web-preview-mutations
  queue: max
  cancel-in-progress: false

jobs:
  cleanup:
    if: contains(fromJSON('["Vaiditya2207/unmask","Pranay0083/unmask","visheshrao17/unmask"]'), github.event.pull_request.head.repo.full_name)
    environment: preview
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: read
      id-token: write
    env:
      PREVIEW_ENVIRONMENT: preview
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
      - run: npm ci --ignore-scripts
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          project_id: unmask-513319
          service_account: unmask-preview-deploy@unmask-513319.iam.gserviceaccount.com
          workload_identity_provider: projects/386156642190/locations/global/workloadIdentityPools/unmask-preview/providers/github
      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3
        with:
          version: 591.0.0
      - name: Remove only closed PR tag and verified unserved owned revisions
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/web-preview.mjs cleanup
