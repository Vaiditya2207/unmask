name: Sync existing release notes

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/release-notes.yml
      - scripts/release-notes.mjs
      - scripts/sync-release-notes.mjs
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-main
  queue: max
  cancel-in-progress: false

jobs:
  sync:
    if: github.repository == 'Vaiditya2207/unmask' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
      - name: Add verified commit history without changing release artifacts
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/sync-release-notes.mjs
