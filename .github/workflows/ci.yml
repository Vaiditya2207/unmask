name: CI

on:
  pull_request:
  push:
  workflow_call:

permissions:
  contents: read

jobs:
  repository-checks:
    name: Repository checks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install locked tooling without lifecycle scripts
        run: npm ci --ignore-scripts
      - name: Check formatting
        run: npm run check
      - name: Test release policy and actual npm packaging
        run: npm test
      - name: Report product release readiness
        id: readiness
        run: node scripts/release-readiness.mjs --github-output
      - name: Test and build configured application
        if: steps.readiness.outputs.ready == 'true'
        run: |
          npm run test:product
          npm run build
          node scripts/release-readiness.mjs --built
      - name: Inspect npm archive allowlist
        run: npm run check:package
