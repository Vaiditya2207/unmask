name: Web preview build

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - "web/**"
      - "package.json"
      - "scripts/web-preview.mjs"
      - ".github/workflows/web-preview-*.yml"

permissions:
  contents: read

concurrency:
  group: web-preview-build-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  image:
    if: contains(fromJSON('["Vaiditya2207/unmask","Pranay0083/unmask","visheshrao17/unmask"]'), github.event.pull_request.head.repo.full_name)
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
      - name: Build exact PR head as Linux AMD64 without deployment credentials
        env:
          PREVIEW_HEAD: ${{ github.event.pull_request.head.sha }}
          PREVIEW_HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          PREVIEW_HEAD_REPOSITORY_ID: ${{ github.event.pull_request.head.repo.id }}
          PREVIEW_PR: ${{ github.event.pull_request.number }}
          PREVIEW_ARTIFACT: ${{ runner.temp }}/preview-image
        run: |
          node --input-type=module <<'NODE'
          import { execFileSync } from 'node:child_process';
          import { readFileSync, writeFileSync, mkdirSync, createReadStream } from 'node:fs';
          import { createHash } from 'node:crypto';
          import path from 'node:path';
          const e = process.env, commit = e.PREVIEW_HEAD;
          if (!/^[a-f0-9]{40}$/.test(commit) || !/^[1-9][0-9]*$/.test(e.PREVIEW_PR)) throw new Error('Invalid preview identity');
          if (execFileSync('git', ['rev-parse', 'HEAD'], { encoding: 'utf8' }).trim() !== commit) throw new Error('Checkout differs');
          const version = JSON.parse(readFileSync('package.json', 'utf8')).version;
          if (typeof version !== 'string' || version.length > 100 || !/^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)(?:-[0-9A-Za-z.-]+)?(?:\+[0-9A-Za-z.-]+)?$/.test(version)) throw new Error('Invalid version');
          const image = `unmask-web-preview-build:${commit}`, dir = e.PREVIEW_ARTIFACT;
          mkdirSync(dir, { recursive: true });
          execFileSync('docker', ['build', '--platform', 'linux/amd64', '--file', 'web/Dockerfile', '--build-arg', `RELEASE_COMMIT=${commit}`, '--build-arg', `RELEASE_VERSION=${version}`, '--label', `org.opencontainers.image.revision=${commit}`, '--label', `org.opencontainers.image.version=${version}`, '--tag', image, 'web'], { stdio: 'inherit' });
          const imageId = JSON.parse(execFileSync('docker', ['image', 'inspect', image], { encoding: 'utf8' }))[0].Id;
          const imageFile = path.join(dir, 'image.tar');
          execFileSync('docker', ['save', '--output', imageFile, image]);
          const hash = createHash('sha256'); for await (const chunk of createReadStream(imageFile)) hash.update(chunk);
          const imageSha256 = hash.digest('hex');
          const metadata = JSON.stringify({ schemaVersion: '1', repository: e.GITHUB_REPOSITORY, headRepository: e.PREVIEW_HEAD_REPOSITORY, headRepositoryId: e.PREVIEW_HEAD_REPOSITORY_ID, commit, version, pr: Number(e.PREVIEW_PR), runId: Number(e.GITHUB_RUN_ID), attempt: Number(e.GITHUB_RUN_ATTEMPT), imageId, imageSha256 });
          writeFileSync(path.join(dir, 'preview.json'), metadata);
          writeFileSync(path.join(dir, 'SHA256SUMS'), `${imageSha256}  image.tar\n${createHash('sha256').update(metadata).digest('hex')}  preview.json\n`);
          NODE
      - name: Retain exact image artifact for one day
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: web-preview-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/preview-image/
          retention-days: 1
          compression-level: 0
          if-no-files-found: error
